name: Verify Workflow Changes

on:
  pull_request:
    paths:
      - '.github/workflows/build-test.yml'

jobs:
  verify-with-act:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup act
        run: |
          # actの特定バージョンをインストール
          curl -L https://github.com/nektos/act/releases/download/v0.2.84/act_Linux_x86_64.tar.gz | sudo tar xz -C /usr/local/bin

      - name: Verify workflow with act
        run: |
          act -j build-and-test --dryrun
          echo "✅ ワークフロー構文検証成功"
