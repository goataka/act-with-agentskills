name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Run verification script
        id: verify
        run: bash verify.sh > verify_output.txt 2>&1
        continue-on-error: true
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('verify_output.txt', 'utf8');
            } catch (e) {
              output = 'ログファイルが見つかりませんでした';
            }
            
            const result = '${{ steps.verify.outcome }}' === 'success' ? '✅ 成功' : '❌ 失敗';
            const body = `## 検証結果: ${result}
            
            \`\`\`
            ${output}
            \`\`\`
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
      - name: Fail if verification failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
